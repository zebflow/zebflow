[package]
name = "zebflow"
version = "0.9.0"
edition = "2024"
description = "Reactive web automation platform — pipelines, templates, and real-time collaboration in a single binary."
license = "MIT"
repository = "https://github.com/zebflow/zebflow"
homepage = "https://zebflow.com"
keywords = ["pipeline", "automation", "reactive", "web", "server"]
categories = ["web-programming::http-server", "command-line-utilities"]

[package.metadata.binstall]
pkg-url = "https://github.com/zebflow/zebflow/releases/download/v{ version }/zebflow-{ target }{ archive-suffix }"
bin-dir = "zebflow{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://github.com/zebflow/zebflow/releases/download/v{ version }/zebflow-linux-amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "https://github.com/zebflow/zebflow/releases/download/v{ version }/zebflow-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "https://github.com/zebflow/zebflow/releases/download/v{ version }/zebflow-darwin-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/zebflow/zebflow/releases/download/v{ version }/zebflow-windows-amd64.zip"
pkg-fmt = "zip"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
saphyr-parser = "0.0.11"
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
pulldown-cmark = "0.12"
swc_common = "19.0.0"
swc_ecma_ast = "21.0.0"
swc_ecma_parser = "35.0.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql", "chrono", "uuid", "json", "bigdecimal"] }
futures = "0.3"
async-stream = "0.3"
arc-swap = "1"
ureq = { version = "2", features = ["json"] }
rmcp = { version = "0.17.0", features = ["server", "transport-io", "transport-streamable-http-server", "schemars"] }
tokio-util = "0.7.18"
rand = "0.10.0"
hex = "0.4.3"
tower = { version = "0.5", features = ["util"] }
oxc_allocator = "0.116.0"
oxc_ast = "0.116.0"
oxc_ast_visit = "0.116.0"
oxc_parser = "0.116.0"
oxc_span = "0.116.0"
oxc_codegen = "0.116.0"
oxc_semantic = "0.116.0"
oxc_transformer = "0.116.0"
deno_core = "0.390.0"
deno_error = "0.7.0"
base64 = "0.22"
infer = "0.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
tiny-skia = "0.11"
# fs.svg.convert: SVG -> pixels without a browser. resvg 0.45 is the version already
# in the tree through pdfwrangler and it is built against tiny-skia 0.11, the
# same one the mapserver uses, so there is one copy of each. `system-fonts`
# stays off here: the node shapes text with the platform's fontdb only.
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
usvg = { version = "0.45", default-features = false, features = ["text"] }
# SVG -> PDF with the text kept as text (subset fonts embedded); same resvg/usvg/fontdb as above.
svg2pdf = { version = "0.13", default-features = false, features = ["text", "image", "filters"] }
roxmltree = "0.20"
multer = "3"
serde_urlencoded = "0.7"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }
dirs-next = "2"
jsonwebtoken = "9"
bcrypt = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
sekejap = "0.16.5"
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
subtle = "2"
# Ed25519 for the controller's signing key (`offices.md` §8). Already in the
# build graph through `jsonwebtoken`, so this adds a name and no crate.
ring = "0.17"
tokio-cron-scheduler = "0.15.1"
chrono = { version = "0.4.44", features = ["serde", "clock"] }
uuid = { version = "1.22.0", features = ["v4"] }
tempfile = "3"
flate2 = "1"
pdfwrangler = "0.1.4"
hound = "3.5"
geonative-core = "0.4.0"
geonative-convert = "0.4.0"
geonative-geoparquet = "0.4.0"
geonative-geojson = "0.4.0"
geonative-utils = "0.4.0"
geonative-tile = "0.4.0"
geodatafusion = "0.4.0"
datafusion = "53.1.0"
parquet = "58.3.0"
object_store = { version = "0.13", features = ["aws", "http"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
wasmtime = { version = "36.0.2", default-features = false, features = ["cranelift", "runtime", "std"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
# The route_fetch SEO scan reads a rendered page's head; regex is already in
# the dependency graph, so this promotes it from dev-only to runtime.
regex = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Debug info dominates the dev target directory: every integration-test binary
# statically links v8, wasmtime and oxc, and each copy carried full symbols.
# Line tables keep file:line in panics and backtraces for our own code, which is
# what we actually read; dependency symbols we never step through.
# For a session that needs full symbols: CARGO_PROFILE_DEV_DEBUG=2 cargo build
# Shipping profile. strip drops symbols the binary never needs at runtime; thin
# LTO is used rather than fat because this dependency tree (v8, wasmtime,
# datafusion) makes a fat-LTO link disproportionately slow for the extra few
# percent. codegen-units = 1 trades build time for a smaller, faster binary.
# opt-level stays at 3 rather than "s": this is a request-serving binary, and
# size-optimising the pipeline engine and SSR path is the wrong trade.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0

apiVersion: zebflow.com/v1
kind: ProjectConfiguration
metadata:
  name: project-layout
spec:
  profile: {}
  layout:
    source: src
    assets: src/assets
    docs: documentation
    schema: db/schema
    sqlite_schema: db/sqlite
    node_interfaces: vendor/nodes
    initial_data:
    - path: db/seeds
      engine: sekejap
  rwe: {}
  pipelines: {}
  runtime: {}
  bootstrap: {}
  git: {}
  assistant: {}
  locks: {}
  data: {}
  files: {}
  distribution:
    hub: {}
